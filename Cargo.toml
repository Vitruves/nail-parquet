[package]
name = "nail-parquet"
version = "1.7.1"
edition = "2021"
authors = ["Johan HG Natter"]
description = "Lightning-fast CLI for data analysis: explore, filter, transform Parquet/CSV/Excel files with SQL-powered operations"
license = "MIT"
repository = "https://github.com/Vitruves/nail-parquet"
keywords = ["parquet", "data-analysis", "csv", "datafusion", "etl"]
categories = ["command-line-utilities", "database"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
clap = { version = "4.5", features = ["derive", "color"] }
clap_complete = "4.5"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
datafusion = { version = "42.2", default-features = false, features = [
    "parquet",
    "compression",
    "datetime_expressions",
    "string_expressions",
    "unicode_expressions",
] }
arrow = "53.1"
arrow-schema = "53.1"
parquet = "53.1"
bytes = "1"
rand = "0.8"
statrs = "0.17"
regex = "1"
futures = "0.3"
rayon = "1.10"
num_cpus = "1.16"
chrono = { version = "0.4", features = ["serde"] }
term_size = "0.3"
crossterm = "0.27"
ratatui = { version = "0.24", default-features = false, features = ["crossterm"] }
calamine = "0.26"
rust_xlsxwriter = "0.88"
colored = "3.0.0"


[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"

[[bin]]
name = "nail"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
